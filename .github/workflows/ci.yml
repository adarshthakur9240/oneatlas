name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://ci_dummy_user:ci_dummy_pass@localhost:5432/ci_db"
          DIRECT_URL: "postgresql://ci_dummy_user:ci_dummy_pass@localhost:5432/ci_db"

      - name: TypeScript Check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Next.js Production Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://ci_dummy_user:ci_dummy_pass@localhost:5432/ci_db"
          DIRECT_URL: "postgresql://ci_dummy_user:ci_dummy_pass@localhost:5432/ci_db"
          NEXT_PUBLIC_APP_URL: "https://oneatlas.dev"
