<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141412;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1d19;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8fc49a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d9a441;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#f2eee6" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="450" y1="0" x2="450" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="750" y1="0" x2="750" y2="300"/>
    <line x1="900" y1="0" x2="900" y2="300"/>
    <line x1="1050" y1="0" x2="1050" y2="300"/>
  </g>

  <!-- Accent gradient bar at top -->
  <rect x="0" y="0" width="1200" height="3" rx="0" fill="url(#accent)"/>

  <!-- Mini bar chart decoration (right side) -->
  <g opacity="0.18" transform="translate(900, 60)">
    <rect x="0" y="80" width="30" height="120" fill="#8fc49a" rx="4"/>
    <rect x="45" y="50" width="30" height="150" fill="#d9a441" rx="4"/>
    <rect x="90" y="30" width="30" height="170" fill="#8fc49a" rx="4"/>
    <rect x="135" y="60" width="30" height="140" fill="#d9a441" rx="4"/>
    <rect x="180" y="20" width="30" height="180" fill="#8fc49a" rx="4"/>
    <rect x="225" y="70" width="30" height="130" fill="#d9a441" rx="4"/>
  </g>

  <!-- Scatter dots decoration -->
  <g opacity="0.14" filter="url(#glow)">
    <circle cx="860" cy="90" r="6" fill="#8fc49a"/>
    <circle cx="880" cy="130" r="4" fill="#d9a441"/>
    <circle cx="840" cy="150" r="8" fill="#8fc49a"/>
    <circle cx="870" cy="180" r="5" fill="#f2eee6"/>
    <circle cx="855" cy="210" r="6" fill="#d9a441"/>
  </g>

  <!-- Main logo mark -->
  <g transform="translate(80, 100)">
    <!-- Atlas globe icon -->
    <circle cx="30" cy="40" r="30" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <ellipse cx="30" cy="40" rx="13" ry="30" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="40" x2="60" y2="40" stroke="url(#accent)" stroke-width="1.5" opacity="0.7"/>
    <line x1="2" y1="25" x2="58" y2="25" stroke="url(#accent)" stroke-width="1" opacity="0.4"/>
    <line x1="2" y1="55" x2="58" y2="55" stroke="url(#accent)" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- OneAtlas wordmark -->
  <text x="160" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="400" letter-spacing="-2" fill="#f2eee6">One<tspan fill="url(#accent)">Atlas</tspan></text>

  <!-- Tagline -->
  <text x="160" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="300" letter-spacing="1" fill="#a09890">Every AI model, compared.</text>

  <!-- Stats pills -->
  <g transform="translate(160, 215)">
    <rect x="0" y="0" width="110" height="30" rx="15" fill="#1e1d19" stroke="#8fc49a" stroke-width="1" stroke-opacity="0.5"/>
    <text x="55" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8fc49a">448 models</text>

    <rect x="125" y="0" width="90" height="30" rx="15" fill="#1e1d19" stroke="#d9a441" stroke-width="1" stroke-opacity="0.5"/>
    <text x="170" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#d9a441">66 labs</text>

    <rect x="230" y="0" width="110" height="30" rx="15" fill="#1e1d19" stroke="#f2eee6" stroke-width="1" stroke-opacity="0.3"/>
    <text x="285" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#a09890">80 providers</text>
  </g>

  <!-- Bottom border accent -->
  <rect x="0" y="297" width="1200" height="3" rx="0" fill="url(#accent)" opacity="0.4"/>
</svg>
